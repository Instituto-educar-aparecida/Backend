services:
  # 🐘 BANCO DE DADOS
  db:
    image: postgres:16-alpine
    container_name: db_educar
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../Backend/src/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - educar_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚙️ BACKEND (Renomeado de 'app' para 'backend' para o Nginx achar)
  backend:
    build:
      context: ../Backend
    container_name: educar_api
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5173
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - educar_network
    depends_on:
      db:
        condition: service_healthy

  # 🖥️ PGADMIN (De volta ao jogo)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: educar_pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - educar_network
    depends_on:
      - db

  #  NGINX (O Porteiro)
  nginx:
    image: nginx:stable-alpine
    container_name: educar_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - educar_network
    depends_on:
      - backend

networks:
  educar_network:
    driver: bridge

volumes:
  pgdata:

